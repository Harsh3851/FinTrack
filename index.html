<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="FinTrack - track income, expenses, budgets and accounts in Indian Rupees."
    />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>FinTrack - Personal Finance Tracker</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var pref = localStorage.getItem('fintrack:theme') || 'system';
          var dark =
            pref === 'dark' ||
            (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <script type="module" crossorigin src="/FinTrack/assets/index-LuafeJZv.js"></script>
    <link rel="modulepreload" crossorigin href="/FinTrack/assets/react-pgrdUJPK.js">
    <link rel="modulepreload" crossorigin href="/FinTrack/assets/charts-x41XrBjz.js">
    <link rel="stylesheet" crossorigin href="/FinTrack/assets/index-CxtAwxVo.css">
  </head>
  <body>
    <div id="root"></div>
    <noscript>FinTrack needs JavaScript enabled.</noscript>
  </body>
</html>
