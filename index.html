<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTrack — Budget Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
        body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a1628 0%,#0d2137 100%)}
        .card{width:960px;background:#fff;border-radius:20px;padding:40px;display:grid;grid-template-columns:240px 1fr 280px;gap:36px;box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative;overflow:hidden}
        .card::before{content:'';position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#1a73e8,#4fc3f7)}

        /* Budget Column */
        .budget-col{display:flex;flex-direction:column;gap:20px}
        .budget-input{width:100%;padding:10px 14px;border:2px solid #dde1e6;border-radius:8px;font-size:14px;outline:none;transition:.2s}
        .budget-input:focus{border-color:#1a73e8}
        .budget-display{font-size:14px;color:#555}
        .budget-display span{font-weight:700;color:#1a73e8}
        .form-title{font-size:18px;font-weight:700;color:#1a73e8;margin-top:8px}
        label{font-size:13px;font-weight:600;color:#333;margin-bottom:2px;display:block}
        .form-group{display:flex;flex-direction:column;gap:4px}
        .btn-add{background:#1a73e8;color:#fff;border:none;padding:10px 28px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;align-self:flex-end;transition:.2s}
        .btn-add:hover{background:#1557b0}

        /* Expense List Column */
        .expense-col{display:flex;flex-direction:column;gap:14px}
        .expense-col h3{text-align:center;color:#1a73e8;font-size:18px;font-weight:700}
        .expense-list{display:flex;flex-direction:column;gap:8px;border:1px solid #e8e8e8;border-radius:10px;padding:12px;min-height:200px}
        .expense-item{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f2f2f2}
        .expense-item:last-child{border:none}
        .expense-name{background:#1a73e8;color:#fff;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:600;min-width:70px;text-align:center}
        .expense-amount{font-size:15px;font-weight:600;color:#333;flex:1;text-align:right;padding-right:12px}
        .expense-del{color:#999;cursor:pointer;font-size:14px;font-weight:700;transition:.2s}
        .expense-del:hover{color:#e74c3c}
        .summary-bar{text-align:center;padding:10px;border-radius:8px;font-size:14px;font-weight:600}
        .summary-budget{background:#d4e6fc;color:#1a73e8}
        .summary-left{background:#d5f5e3;color:#27ae60}
        .trash-icon{text-align:center;margin-top:8px;color:#999;font-size:18px;cursor:pointer;transition:.2s}
        .trash-icon:hover{color:#e74c3c}

        /* Chart Column */
        .chart-col{display:flex;flex-direction:column;align-items:center;gap:12px}
        .chart-col h3{color:#1a73e8;font-size:18px;font-weight:700}
        .chart-wrapper{width:100%}
        .chart-wrapper canvas{width:100%!important;height:auto!important}
    </style>
</head>
<body>
    <div class="card">
        <div class="budget-col">
            <input type="number" class="budget-input" id="budgetInput" value="10000" placeholder="Enter budget">
            <div class="budget-display">Your Budget is: <span id="budgetDisplay">10,000</span> Dollars</div>
            <div class="form-title">Enter Your Expenses Here...</div>
            <div class="form-group">
                <label>Name:</label>
                <input type="text" class="budget-input" id="expName" placeholder="e.g. Coffee">
            </div>
            <div class="form-group">
                <label>Enter Amount:</label>
                <input type="number" class="budget-input" id="expAmount" placeholder="e.g. 20">
            </div>
            <button class="btn-add" onclick="addExpense()">Add</button>
        </div>

        <div class="expense-col">
            <h3>List of Expenses</h3>
            <div class="expense-list" id="expenseList"></div>
            <div class="summary-bar summary-budget">Budget: <span id="totalBudget">10,000</span></div>
            <div class="summary-bar summary-left">Left: <span id="totalLeft">10,000</span></div>
            <div class="trash-icon" onclick="clearAll()" title="Clear all"><i class="fas fa-trash"></i></div>
        </div>

        <div class="chart-col">
            <h3>Chart</h3>
            <div class="chart-wrapper"><canvas id="pieChart"></canvas></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script>
        const colors = ['#3366cc','#dc3912','#ff9900','#109618','#990099','#0099c6','#dd4477','#66aa00'];
        let expenses = [
            {name:'Taxi',amount:45},{name:'Flight',amount:1350},{name:'Rent',amount:3100},{name:'Internet',amount:35},{name:'Coffee',amount:20}
        ];
        let budget = 10000;
        let chart;

        function fmt(n){return n.toLocaleString()}
        function render(){
            const list = document.getElementById('expenseList');
            list.innerHTML = expenses.map((e,i)=>`<div class="expense-item"><span class="expense-name" style="background:${colors[i%colors.length]}">${e.name}</span><span class="expense-amount">$${fmt(e.amount)}</span><span class="expense-del" onclick="removeExpense(${i})">X</span></div>`).join('');
            const total = expenses.reduce((s,e)=>s+e.amount,0);
            document.getElementById('totalBudget').textContent = fmt(budget);
            document.getElementById('totalLeft').textContent = fmt(budget - total);
            document.getElementById('budgetDisplay').textContent = fmt(budget);
            updateChart();
        }
        function addExpense(){
            const name = document.getElementById('expName').value.trim();
            const amount = parseFloat(document.getElementById('expAmount').value);
            if(!name||!amount) return;
            expenses.push({name,amount});
            document.getElementById('expName').value='';
            document.getElementById('expAmount').value='';
            render();
        }
        function removeExpense(i){expenses.splice(i,1);render()}
        function clearAll(){expenses=[];render()}
        function updateChart(){
            const ctx = document.getElementById('pieChart');
            if(chart) chart.destroy();
            if(!expenses.length) return;
            chart = new Chart(ctx,{type:'pie',data:{labels:expenses.map(e=>e.name),datasets:[{data:expenses.map(e=>e.amount),backgroundColor:colors.slice(0,expenses.length),borderWidth:2,borderColor:'#fff'}]},options:{plugins:{legend:{position:'right',labels:{font:{size:12},padding:12}},title:{display:true,text:'Chart of Expenses',font:{size:15,weight:700}}}}});
        }
        document.getElementById('budgetInput').addEventListener('change',function(){budget=parseFloat(this.value)||0;render()});
        render();
    </script>
</body>
</html>
